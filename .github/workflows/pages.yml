# Publishes the static site (public/) to GitHub Pages, with fresh data, every two hours.
# Accounts, alerts, the API and paid plans need the Cloudflare Worker (see data.yml);
# on Pages those features are hidden and everything else works.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.DEPLOY_TARGET != 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cached between runs so each upstream source is only downloaded as often as it allows.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Build data
        run: node pipeline/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
