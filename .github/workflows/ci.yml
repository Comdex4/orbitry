name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vendored libraries match package versions
        run: node scripts/vendor.js && git diff --exit-code public/vendor
      - name: Worker bundles
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
