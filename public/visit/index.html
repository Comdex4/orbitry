<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landing site in 3D — Orbitry</title>
<meta name="description" content="Look around a Moon or Mars landing site in 3D, with NASA's model of the spacecraft that landed there.">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<style>
.card-ov{left:12px;top:12px;width:min(360px,calc(100% - 24px));padding:16px 18px}
.card-ov h1{font-size:1.25rem}
.card-ov .sub{color:var(--mute);font-size:.84rem;margin:4px 0 10px}
.card-ov dl{font-size:.86rem}
.note-ov{left:12px;bottom:12px;max-width:min(520px,calc(100% - 24px));padding:9px 12px;font-size:.78rem;color:var(--mute)}
.note-ov:empty{display:none}
.ctl-ov{right:12px;bottom:12px;display:flex;gap:6px;padding:6px}
@media(max-width:700px){.card-ov{padding:12px 14px}.card-ov dl{display:none}.note-ov{bottom:64px}}
</style>
</head>
<body class="app">
<main class="app-main" id="stage">
  <canvas class="view" id="canvas" role="img" aria-label="3D scene of a landing site with the spacecraft that landed there. Drag to look around, scroll or pinch to zoom."></canvas>
  <aside class="float card-ov panel" id="card"><p class="mute">Loading…</p></aside>
  <p class="float note-ov panel" id="note"></p>
  <div class="float ctl-ov panel"><button class="btn small" type="button" id="spin" aria-pressed="true">Auto-rotate</button><button class="btn small" type="button" id="reset">Reset view</button></div>
  <div class="loading" id="loading"><div><div class="spin"></div><span id="loadMsg">Loading the 3D model…</span></div></div>
</main>
<script type="module" src="/js/app/visit.js"></script>
</body>
</html>
